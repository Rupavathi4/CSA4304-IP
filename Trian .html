<!DOCTYPE html>
<html>
<head>
    <title>Train Reservation System</title>
</head>
<body>

<h1>Train Reservation System</h1>

<form>
    Name:<br>
    <input type="text"><br><br>

    From:<br>
    <input type="text"><br><br>

    To:<br>
    <input type="text"><br><br>

    Journey Date:<br>
    <input type="date"><br><br>

    Class:<br>
    <select>
        <option>Sleeper</option>
        <option>3A</option>
        <option>2A</option>
        <option>1A</option>
    </select><br><br>

    <input type="submit" value="Reserve Ticket">
</form>

</body>
</html>
