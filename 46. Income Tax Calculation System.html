<!DOCTYPE html>
<html>
<head>
<title>Income Tax Calculator</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f0fdf4;color:#1f2937}
header{background:#166534;color:white;padding:20px 8%;display:flex;justify-content:space-between}
.logo{font-size:28px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:10px}
.hero{text-align:center;padding:70px;background:#dcfce7}
.hero h1{font-size:50px;color:#166534}
section{padding:60px 8%}
.calculator{max-width:600px;margin:auto;background:white;padding:35px;border-radius:15px;box-shadow:0 5px 20px #0001}
input{width:100%;padding:13px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:14px;background:#16a34a;color:white;border:0;border-radius:7px}
.result{margin-top:20px;padding:20px;background:#dcfce7;line-height:2}
footer{background:#052e16;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">💰 TaxCalc</div>
<nav><a href="#home">Home</a><a href="#calculator">Calculator</a></nav>
</header>

<section class="hero" id="home">
<h1>Income Tax Calculator</h1>
<p>Estimate your annual income tax easily.</p>
</section>

<section id="calculator">
<div class="calculator">
<h2>🧮 Calculate Tax</h2>
<input id="income" type="number" placeholder="Annual Income ₹">
<button onclick="calculate()">Calculate Tax</button>
<div class="result" id="result"></div>
</div>
</section>

<footer>
<h2>TaxCalc 💰</h2>
<p>Simple Income Tax Estimation</p>
</footer>

<script>
function calculate(){
let income=Number(document.getElementById("income").value);

if(!income || income<0){
alert("Enter a valid income");
return;
}

let tax=0;

if(income<=300000){
tax=0;
}else if(income<=600000){
tax=(income-300000)*0.05;
}else if(income<=900000){
tax=15000+(income-600000)*0.10;
}else if(income<=1200000){
tax=45000+(income-900000)*0.15;
}else if(income<=1500000){
tax=90000+(income-1200000)*0.20;
}else{
tax=150000+(income-1500000)*0.30;
}

document.getElementById("result").innerHTML=
"<b>Annual Income:</b> ₹"+income.toLocaleString()+
"<br><b>Estimated Tax:</b> ₹"+tax.toLocaleString(undefined,{maximumFractionDigits:2})+
"<br><b>Income After Tax:</b> ₹"+(income-tax).toLocaleString(undefined,{maximumFractionDigits:2});
}
</script>

</body>
</html>
