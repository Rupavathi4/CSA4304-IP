<!DOCTYPE html>
<html>
<head>
<title>Dairy Farm Management</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f0fdf4;color:#1f2937}
header{background:#166534;color:white;padding:20px 8%;display:flex;justify-content:space-between}
.logo{font-size:28px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:10px}
.hero{text-align:center;padding:75px;background:#dcfce7}
.hero h1{font-size:50px;color:#166534}
section{padding:60px 8%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:25px}
.card{background:white;padding:30px;text-align:center;border-radius:15px;box-shadow:0 5px 20px #0001}
.icon{font-size:50px}
.card h2{color:#15803d}
.form{max-width:600px;margin:auto;background:white;padding:35px;border-radius:15px}
input,select{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:13px;background:#16a34a;color:white;border:0;border-radius:7px}
.result{text-align:center;margin-top:15px}
footer{background:#052e16;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">🐄 GreenDairy</div>
<nav><a href="#home">Home</a><a href="#dashboard">Dashboard</a><a href="#add">Add Record</a></nav>
</header>

<section class="hero" id="home">
<h1>Smart Dairy Farm Management</h1>
<p>Manage cattle, milk production and farm records easily.</p>
</section>

<section id="dashboard">
<h2 style="text-align:center;margin-bottom:35px">Farm Dashboard</h2>
<div class="cards">
<div class="card"><div class="icon">🐄</div><h2>48</h2><p>Total Cows</p></div>
<div class="card"><div class="icon">🥛</div><h2>320 L</h2><p>Today's Milk</p></div>
<div class="card"><div class="icon">💰</div><h2>₹18,500</h2><p>Monthly Sales</p></div>
<div class="card"><div class="icon">🌾</div><h2>120 Kg</h2><p>Feed Used</p></div>
</div>
</section>

<section id="add" style="background:#dcfce7">
<div class="form">
<h2>🐄 Add Cow Record</h2>
<input id="id" placeholder="Cow ID">
<input id="breed" placeholder="Breed">
<input id="milk" placeholder="Daily Milk (Litres)">
<select><option>Healthy</option><option>Under Treatment</option></select>
<button onclick="add()">Save Record</button>
<div class="result" id="result"></div>
</div>
</section>

<footer>
<h2>GreenDairy 🐄</h2>
<p>Smart Farming Management</p>
</footer>

<script>
function add(){
let id=document.getElementById("id").value;
if(!id){alert("Enter Cow ID");return}
document.getElementById("result").innerHTML="✅ Cow record saved successfully!";
}
</script>

</body>
</html>
