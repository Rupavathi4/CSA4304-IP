<!DOCTYPE html>
<html>
<head>
<title>Phone Bill Payment</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#eff6ff;color:#1e293b}
header{background:#1e3a8a;color:white;padding:20px 8%;display:flex;justify-content:space-between}
.logo{font-size:28px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:10px}
.hero{text-align:center;padding:75px;background:linear-gradient(120deg,#dbeafe,#e0e7ff)}
.hero h1{font-size:50px;color:#1d4ed8}
section{padding:60px 8%}
.form{max-width:600px;margin:auto;background:white;padding:35px;border-radius:15px;box-shadow:0 5px 20px #0001}
input,select{width:100%;padding:13px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:14px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
.bill{margin-top:20px;padding:20px;background:#eff6ff;line-height:2}
footer{background:#0f172a;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">📱 MobilePay</div>
<nav><a href="#home">Home</a><a href="#bill">Pay Bill</a></nav>
</header>

<section class="hero" id="home">
<h1>Pay Your Phone Bill Online</h1>
<p>Fast, simple and convenient mobile bill payment.</p>
</section>

<section id="bill">
<div class="form">
<h2>📱 Check Phone Bill</h2>

<input id="phone" placeholder="Mobile Number" maxlength="10">

<select id="operator">
<option>Jio</option>
<option>Airtel</option>
<option>Vi</option>
<option>BSNL</option>
</select>

<button onclick="checkBill()">Check Bill</button>

<div class="bill" id="result"></div>
</div>
</section>

<footer>
<h2>MobilePay 📱</h2>
<p>Fast • Easy • Secure</p>
</footer>

<script>
function checkBill(){

let phone=document.getElementById("phone").value;
let operator=document.getElementById("operator").value;

if(phone.length!==10 || isNaN(phone)){
alert("Enter a valid 10-digit mobile number");
return;
}

let amount=699;

document.getElementById("result").innerHTML=
"<b>Mobile Number:</b> "+phone+
"<br><b>Operator:</b> "+operator+
"<br><b>Plan:</b> Monthly Postpaid"+
"<br><b>Bill Amount:</b> ₹"+amount+
"<br><br><button onclick='pay()'>Pay ₹"+amount+"</button>";
}

function pay(){
alert("✅ Payment successful! Thank you.");
}
</script>

</body>
</html>
