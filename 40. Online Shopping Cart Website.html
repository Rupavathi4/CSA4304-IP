<!DOCTYPE html>
<html>
<head>
<title>ShopEasy</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f8fafc;color:#1e293b}
header{background:#7c3aed;color:white;padding:20px 8%;display:flex;justify-content:space-between}
.logo{font-size:28px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:10px}
.hero{text-align:center;padding:70px;background:#ede9fe}
.hero h1{font-size:50px;color:#6d28d9}
section{padding:50px 8%}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px}
.product{background:white;padding:25px;border-radius:15px;text-align:center;box-shadow:0 5px 20px #0001}
.pic{font-size:70px;background:#f5f3ff;padding:25px}
.price{color:#7c3aed;font-weight:bold;font-size:20px;margin:12px}
button{background:#7c3aed;color:white;border:0;padding:12px;width:100%;border-radius:7px;cursor:pointer}
.cart{background:#ede9fe;margin-top:30px;padding:25px;border-radius:15px}
footer{background:#2e1065;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">🛍️ ShopEasy</div>
<nav><a href="#home">Home</a><a href="#products">Products</a><a href="#cart">Cart 🛒</a></nav>
</header>

<section class="hero" id="home">
<h1>Everything You Need</h1>
<p>Shop your favorite products online.</p>
</section>

<section id="products">
<h2 style="text-align:center">Featured Products</h2><br>
<div class="products">
<div class="product"><div class="pic">👟</div><h3>Sneakers</h3><div class="price">₹1,999</div><button onclick="add('Sneakers',1999)">Add to Cart</button></div>
<div class="product"><div class="pic">🎧</div><h3>Headphones</h3><div class="price">₹2,499</div><button onclick="add('Headphones',2499)">Add to Cart</button></div>
<div class="product"><div class="pic">⌚</div><h3>Smart Watch</h3><div class="price">₹3,999</div><button onclick="add('Smart Watch',3999)">Add to Cart</button></div>
<div class="product"><div class="pic">🎒</div><h3>Backpack</h3><div class="price">₹999</div><button onclick="add('Backpack',999)">Add to Cart</button></div>
</div>

<div class="cart" id="cart">
<h2>🛒 Shopping Cart</h2>
<p id="items">No items added.</p>
<h3 id="total">Total: ₹0</h3>
</div>
</section>

<footer>
<h2>ShopEasy 🛍️</h2>
<p>Shop Smart. Shop Easy.</p>
</footer>

<script>
let total=0,items=[];
function add(name,price){
items.push(name);
total+=price;
document.getElementById("items").innerHTML=items.join("<br>");
document.getElementById("total").innerHTML="Total: ₹"+total;
}
</script>

</body>
</html>
