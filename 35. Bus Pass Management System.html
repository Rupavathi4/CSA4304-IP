<!DOCTYPE html>
<html>
<head>
<title>CityBus Pass</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f8fafc;color:#1e293b}
header{background:#0369a1;color:white;padding:20px 8%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:10px}
.hero{text-align:center;padding:75px;background:linear-gradient(120deg,#bae6fd,#e0f2fe)}
.hero h1{font-size:50px;color:#075985}
section{padding:60px 8%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:25px}
.card{background:white;padding:30px;text-align:center;border-radius:15px;box-shadow:0 5px 20px #0001}
.icon{font-size:50px}
.card h3{color:#0369a1}
.form{max-width:600px;margin:auto;background:white;padding:35px;border-radius:15px}
input,select{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:13px;background:#0284c7;color:white;border:0;border-radius:7px;cursor:pointer}
.result{text-align:center;margin-top:15px}
footer{background:#082f49;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">🚌 CityBus</div>
<nav><a href="#home">Home</a><a href="#passes">Passes</a><a href="#apply">Apply</a></nav>
</header>

<section class="hero" id="home">
<h1>Smart Bus Pass System</h1>
<p>Apply for your bus pass quickly and easily.</p>
</section>

<section id="passes">
<h2 style="text-align:center">Available Passes</h2><br>
<div class="cards">
<div class="card"><div class="icon">🎓</div><h3>Student</h3><p>₹500 / Month</p></div>
<div class="card"><div class="icon">👨‍💼</div><h3>Employee</h3><p>₹900 / Month</p></div>
<div class="card"><div class="icon">👴</div><h3>Senior Citizen</h3><p>₹400 / Month</p></div>
</div>
</section>

<section id="apply" style="background:#e0f2fe">
<div class="form">
<h2>Apply for Pass</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="route" placeholder="Travel Route">
<select id="type">
<option>Student Pass</option>
<option>Employee Pass</option>
<option>Senior Citizen Pass</option>
</select>
<button onclick="applyPass()">Apply Now</button>
<div class="result" id="result"></div>
</div>
</section>

<footer>
<h2>CityBus 🚌</h2>
<p>Safe • Smart • Affordable Travel</p>
</footer>

<script>
function applyPass(){
let n=document.getElementById("name").value;
let r=document.getElementById("route").value;
if(!n||!r){alert("Please fill all details");return}
document.getElementById("result").innerHTML=
"✅ Application submitted!<br>Pass ID: CB"+Date.now();
}
</script>
</body>
</html>
