<!DOCTYPE html>
<html>
<head>
<title>Painting Rating & Review</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#faf5ff;color:#292524}
header{background:#581c87;color:white;padding:20px 8%;display:flex;justify-content:space-between}
.logo{font-size:28px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:10px}
.hero{text-align:center;padding:75px;background:#f3e8ff}
.hero h1{font-size:50px;color:#7e22ce}
section{padding:60px 8%}
.paintings{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:25px}
.painting{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 20px #0001}
.art{font-size:80px;text-align:center;background:#f5f3ff;padding:30px}
.stars{color:#f59e0b;font-size:24px}
.form{max-width:600px;margin:auto;background:white;padding:35px;border-radius:15px}
textarea,input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:13px;background:#7e22ce;color:white;border:0;border-radius:7px}
footer{background:#2e1065;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">🎨 ArtReview</div>
<nav><a href="#home">Home</a><a href="#paintings">Paintings</a><a href="#review">Review</a></nav>
</header>

<section class="hero" id="home">
<h1>Rate & Review Artwork</h1>
<p>Discover beautiful paintings and share your opinion.</p>
</section>

<section id="paintings">
<h2 style="text-align:center">Featured Paintings</h2><br>
<div class="paintings">
<div class="painting"><div class="art">🌅</div><h3>Golden Sunset</h3><div class="stars">★★★★★</div><p>4.8 / 5</p></div>
<div class="painting"><div class="art">🌸</div><h3>Spring Garden</h3><div class="stars">★★★★☆</div><p>4.4 / 5</p></div>
<div class="painting"><div class="art">🌌</div><h3>Night Sky</h3><div class="stars">★★★★★</div><p>4.9 / 5</p></div>
</div>
</section>

<section id="review" style="background:#f3e8ff">
<div class="form">
<h2>⭐ Submit Your Review</h2>
<input id="name" placeholder="Your Name">
<select id="rating" style="width:100%;padding:12px">
<option>★★★★★</option>
<option>★★★★☆</option>
<option>★★★☆☆</option>
<option>★★☆☆☆</option>
<option>★☆☆☆☆</option>
</select>
<textarea id="comment" placeholder="Write your review"></textarea>
<button onclick="review()">Submit Review</button>
<p id="result"></p>
</div>
</section>

<footer>
<h2>ArtReview 🎨</h2>
<p>Every opinion matters.</p>
</footer>

<script>
function review(){
let n=document.getElementById("name").value;
if(!n){alert("Enter your name");return}
document.getElementById("result").innerHTML="✅ Thank you "+n+"! Your review was submitted.";
}
</script>

</body>
</html>
