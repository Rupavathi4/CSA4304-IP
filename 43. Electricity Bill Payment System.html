<!DOCTYPE html>
<html>
<head>
<title>Electricity Bill Payment</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#eff6ff;color:#1e293b}
header{background:#1e3a8a;color:white;padding:20px 8%;display:flex;justify-content:space-between}
.logo{font-size:28px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:10px}
.hero{text-align:center;padding:75px;background:#dbeafe}
.hero h1{font-size:50px;color:#1d4ed8}
section{padding:60px 8%}
.form{max-width:600px;margin:auto;background:white;padding:35px;border-radius:15px;box-shadow:0 5px 20px #0001}
input{width:100%;padding:13px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:14px;background:#2563eb;color:white;border:0;border-radius:7px}
.bill{margin-top:20px;padding:20px;background:#eff6ff;line-height:2}
footer{background:#0f172a;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">⚡ PowerPay</div>
<nav><a href="#home">Home</a><a href="#pay">Pay Bill</a></nav>
</header>

<section class="hero" id="home">
<h1>Electricity Bill Payment</h1>
<p>Check and pay your electricity bill online.</p>
</section>

<section id="pay">
<div class="form">
<h2>⚡ Check Your Bill</h2>
<input id="consumer" placeholder="Consumer Number">
<input id="name" placeholder="Consumer Name">
<button onclick="checkBill()">Check Bill</button>
<div class="bill" id="bill"></div>
</div>
</section>

<footer>
<h2>PowerPay ⚡</h2>
<p>Simple • Secure • Fast</p>
</footer>

<script>
function checkBill(){
let c=document.getElementById("consumer").value;
let n=document.getElementById("name").value;
if(!c||!n){alert("Please enter all details");return}
document.getElementById("bill").innerHTML=
"<b>Consumer:</b> "+n+
"<br><b>Consumer No:</b> "+c+
"<br><b>Bill Amount:</b> ₹1,240"+
"<br><b>Due Date:</b> 25 August 2026"+
"<br><br><button onclick=\"pay()\">Pay ₹1,240</button>";
}
function pay(){
alert("✅ Payment successful!");
}
</script>

</body>
</html>
