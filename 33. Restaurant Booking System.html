<!DOCTYPE html>
<html>
<head>
<title>Restaurant Booking</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#fff7ed;color:#292524}
header{background:#9a3412;color:white;padding:20px 8%;display:flex;justify-content:space-between}
.logo{font-size:28px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:10px}
.hero{text-align:center;padding:80px;background:linear-gradient(120deg,#fed7aa,#ffedd5)}
.hero h1{font-size:55px;color:#9a3412}
section{padding:60px 8%}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px}
.item{background:white;padding:25px;text-align:center;border-radius:15px;box-shadow:0 5px 20px #0001}
.food{font-size:60px}
.price{color:#ea580c;font-size:20px;font-weight:bold}
.form{max-width:600px;margin:auto;background:white;padding:35px;border-radius:15px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:13px;background:#ea580c;color:white;border:0;border-radius:7px}
.result{text-align:center;margin-top:15px}
footer{background:#431407;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">🍽️ Spice Garden</div>
<nav><a href="#home">Home</a><a href="#menu">Menu</a><a href="#book">Book Table</a></nav>
</header>

<section class="hero" id="home">
<h1>Delicious Food, Beautiful Moments</h1>
<p>Reserve your table and enjoy a wonderful dining experience.</p>
</section>

<section id="menu">
<h2 style="text-align:center;margin-bottom:35px">Our Popular Menu</h2>
<div class="menu">
<div class="item"><div class="food">🍕</div><h3>Italian Pizza</h3><div class="price">₹299</div></div>
<div class="item"><div class="food">🍛</div><h3>Indian Thali</h3><div class="price">₹249</div></div>
<div class="item"><div class="food">🍝</div><h3>Pasta</h3><div class="price">₹279</div></div>
<div class="item"><div class="food">🍰</div><h3>Chocolate Cake</h3><div class="price">₹199</div></div>
</div>
</section>

<section id="book" style="background:#ffedd5">
<div class="form">
<h2>🍽️ Reserve Your Table</h2>
<input id="name" placeholder="Name">
<input id="date" type="date">
<input id="time" type="time">
<input id="people" type="number" placeholder="Number of Guests">
<button onclick="reserve()">Reserve Table</button>
<div class="result" id="result"></div>
</div>
</section>

<footer>
<h2>Spice Garden</h2>
<p>Good Food • Great Moments</p>
</footer>

<script>
function reserve(){
let n=document.getElementById("name").value;
if(!n){alert("Enter your name");return}
document.getElementById("result").innerHTML="✅ Table reserved successfully for "+n+"!";
}
</script>

</body>
</html>
