<!DOCTYPE html>
<html>
<head>
<title>e-Challan Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f8fafc;color:#1e293b}
header{background:#172554;color:white;padding:18px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:bold}.logo span{color:#60a5fa}
nav a{color:white;text-decoration:none;margin:10px}
.hero{padding:70px 8%;text-align:center;background:#dbeafe}
.hero h1{font-size:48px}.hero span{color:#2563eb}.hero p{color:#64748b;margin:15px}
.form{max-width:600px;margin:60px auto;background:white;padding:35px;border-radius:15px;box-shadow:0 5px 20px #0001}
.field{margin-bottom:15px}label{display:block;font-weight:bold;margin-bottom:7px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:14px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
.result{margin-top:20px;padding:20px;background:#eff6ff;border-radius:8px;line-height:1.8}
.info{padding:60px 7%;text-align:center}.cards{display:flex;justify-content:center;gap:25px;flex-wrap:wrap}
.card{background:white;padding:25px;width:220px;border-radius:12px;box-shadow:0 5px 15px #0001}
.card h3{color:#2563eb;margin-bottom:10px}
footer{background:#0f172a;color:white;text-align:center;padding:40px}
</style>
</head>
<body>

<header>
<div class="logo">e<span>Challan</span> 🚦</div>
<nav><a href="#home">Home</a><a href="#check">Check Challan</a><a href="#contact">Contact</a></nav>
</header>

<section class="hero" id="home">
<h1>Traffic Challan <span>Portal</span> 🚔</h1>
<p>Check your traffic challans and payment status online.</p>
</section>

<div class="form" id="check">
<h2>🔎 Check e-Challan</h2><br>
<div class="field"><label>Vehicle Number</label><input id="vehicle" placeholder="TN01AB1234"></div>
<div class="field"><label>Challan Number</label><input id="challan" placeholder="Enter challan number"></div>
<button onclick="check()">Check Challan</button>
<div class="result" id="result"></div>
</div>

<section class="info">
<div class="cards">
<div class="card"><h3>🔍 Search</h3><p>Find pending challans.</p></div>
<div class="card"><h3>💳 Payment</h3><p>Pay challan online.</p></div>
<div class="card"><h3>📄 Receipt</h3><p>Download payment receipt.</p></div>
</div>
</section>

<footer id="contact"><h2>e-Challan Portal</h2><p>Traffic Management System</p><p>© 2026</p></footer>

<script>
function check(){
let v=document.getElementById("vehicle").value;
let c=document.getElementById("challan").value;
if(!v||!c){alert("Please enter vehicle and challan number");return}
document.getElementById("result").innerHTML=
"⚠️ Challan Found<br>Vehicle: "+v+
"<br>Challan No: "+c+
"<br>Fine Amount: ₹1,000<br>Status: Pending Payment";
}
</script>
</body>
</html>
